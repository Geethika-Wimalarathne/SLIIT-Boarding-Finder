<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLIIT Boarding Finder — Owner Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { margin: 0; background: #f8fafc; color: #0f172a; }
        nav {
          background: #0f172a;
          color: #fff;
          padding: 14px 28px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 12px;
        }
        .nav-brand { font-size: 18px; font-weight: 700; color: #93c5fd; text-decoration: none; }
        .nav-links { display: flex; gap: 14px; align-items: center; }
        .nav-links a, .nav-links button {
          color: #e2e8f0;
          text-decoration: none;
          background: transparent;
          border: 1px solid #334155;
          padding: 6px 12px;
          border-radius: 8px;
          font-size: 13px;
          cursor: pointer;
        }
        .container {
          max-width: 1100px;
          margin: 24px auto;
          padding: 0 20px;
          display: grid;
          grid-template-columns: 1fr 1.3fr;
          gap: 24px;
        }
        @media (max-width: 820px) { .container { grid-template-columns: 1fr; } }
        .card {
          background: #fff;
          border-radius: 14px;
          padding: 20px;
          box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }
        h2 { margin-top: 0; font-size: 18px; color: #1e3a8a; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; }
        input[type="text"], input[type="number"] {
          width: 100%;
          padding: 9px 11px;
          border: 1px solid #cbd5e1;
          border-radius: 8px;
          font-size: 14px;
        }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .checks { display: flex; gap: 20px; margin: 12px 0; font-size: 14px; }
        .btn-primary {
          width: 100%;
          padding: 11px;
          border: none;
          border-radius: 8px;
          background: #2563eb;
          color: #fff;
          font-weight: 600;
          cursor: pointer;
          font-size: 14px;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger {
          background: #fee2e2;
          color: #b91c1c;
          border: none;
          padding: 6px 10px;
          border-radius: 6px;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
        }
        .listing-row {
          border: 1px solid #e2e8f0;
          border-radius: 10px;
          padding: 14px;
          margin-bottom: 12px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
        }
        .status {
          font-size: 11px;
          font-weight: 700;
          padding: 4px 10px;
          border-radius: 999px;
          display: inline-block;
          margin-top: 4px;
        }
        .status.PENDING { background: #fef3c7; color: #92400e; }
        .status.APPROVED { background: #dcfce7; color: #166534; }
        .status.REJECTED { background: #fee2e2; color: #991b1c; }
        .msg { margin-top: 10px; font-size: 13px; color: #166534; }
    </style>
</head>
<body>
<nav>
    <a class="nav-brand" href="/index.html">SLIIT Boarding Finder</a>
    <div class="nav-links" id="navRight">
        <a href="/index.html">Browse Boardings</a>
        <a href="/admin.html">Admin</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>Add New Boarding Listing</h2>
        <form id="listingForm" onsubmit="createListing(event)">
            <div class="form-group">
                <label for="title">Boarding Title</label>
                <input type="text" id="title" required placeholder="e.g. Malabe Girls Hostel near SLIIT" />
            </div>
            <div class="row-2">
                <div class="form-group">
                    <label for="price">Monthly Rent (LKR)</label>
                    <input type="number" id="price" required placeholder="20000" />
                </div>
                <div class="form-group">
                    <label for="distanceKm">Distance to SLIIT (km)</label>
                    <input type="number" step="0.1" id="distanceKm" required placeholder="0.8" />
                </div>
            </div>
            <div class="row-2">
                <div class="form-group">
                    <label for="rooms">Available Rooms</label>
                    <input type="number" id="rooms" value="1" min="1" required />
                </div>
                <div class="form-group">
                    <label for="phone">Contact Phone</label>
                    <input type="text" id="phone" required placeholder="0771234567" />
                </div>
                <div class="form-group">
                    <label for="imageFile">Boarding Photo</label>
                    <input type="file" id="imageFile" accept="image/*" />
                </div>
            </div>
            <div class="row-2">
                <div class="form-group">
                    <label for="lat">Latitude (Optional)</label>
                    <input type="number" step="any" id="lat" placeholder="6.9147" />
                </div>
                <div class="form-group">
                    <label for="lng">Longitude (Optional)</label>
                    <input type="number" step="any" id="lng" placeholder="79.9729" />
                </div>
            </div>
            <div class="checks">
                <label><input type="checkbox" id="wifi" /> Free Wi-Fi</label>
                <label><input type="checkbox" id="food" /> Meals Provided</label>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="3" placeholder="e.g. Walking distance to SLIIT, quiet study environment, water & electricity included"></textarea>
            </div>
            <button type="submit" class="btn-primary">Submit for Admin Approval</button>
            <div id="formMsg" class="msg"></div>
        </form>
    </div>

    <div class="card">
        <h2>My Listings</h2>
        <div id="myListings">Loading...</div>
    </div>
</div>

<script>
    const rawUser = localStorage.getItem("sliitUser");
    if (!rawUser) {
      alert("Please login as a Boarding Owner first.");
      window.location.href = "/login.html";
    }
    const currentUser = JSON.parse(rawUser || "{}");

    if (currentUser.role !== "OWNER" && currentUser.role !== "ADMIN") {
      alert("Access Denied! Only Boarding Owners or Admins can access this page.");
      window.location.href = "/index.html";
    }

    function initNav() {
      const navRight = document.getElementById("navRight");
      if (!navRight) return;
      navRight.innerHTML = "";

      const span = document.createElement("span");
      span.style.fontSize = "13px";
      span.style.color = "#93c5fd";
      span.textContent = `${currentUser.name} (${currentUser.role})`;

      const logoutBtn = document.createElement("button");
      logoutBtn.textContent = "Logout";
      logoutBtn.onclick = () => {
        localStorage.removeItem("sliitUser");
        window.location.href = "/login.html";
      };

      navRight.append(span, logoutBtn);
    }

    async function loadMyListings() {
      const container = document.getElementById("myListings");
      try {
        const res = await fetch(`/api/listings/owner/${currentUser.id}`);
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) {
          container.innerHTML = "<p class='muted'>You haven't added any boarding listings yet.</p>";
          return;
        }
        container.innerHTML = list.map(item => `
          <div class="listing-item">
            <div>
              <span class="status ${item.status}">${item.status}</span>
              <h3 style="margin:6px 0 4px;">${escapeHtml(item.title || "")}</h3>
              <div class="muted">LKR ${Number(item.price || 0).toLocaleString()} / month • ${item.distanceKm ?? ""} km from SLIIT • ${escapeHtml(item.phone || "")}</div>
              ${item.rooms ? `<div class="muted" style="margin-top:2px;">Available Rooms: ${escapeHtml(item.rooms)}</div>` : ""}
              ${item.address ? `<div class="muted" style="margin-top:4px;">${escapeHtml(item.address)}</div>` : ""}
              ${item.description ? `<div class="muted" style="margin-top:4px;">${escapeHtml(item.description)}</div>` : ""}
            </div>
            <button class="btn-danger" onclick="deleteListing(${item.id})">Delete</button>
          </div>
        `).join("");
      } catch (e) {
        container.innerHTML = "<p class='muted'>Failed to load your listings.</p>";
      }
    }

    async function createListing(e) {
      e.preventDefault();
      const msg = document.getElementById("formMsg");
      if (msg) {
        msg.style.color = "#334155";
        msg.textContent = "Submitting...";
      }

      if (!currentUser || !currentUser.id) {
        if (msg) {
          msg.style.color = "#dc2626";
          msg.textContent = "User session missing. Please login again.";
        }
        return;
      }

      try {
        let imageUrl = null;
        const fileInput = document.getElementById("imageFile");
        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          const uploadRes = await fetch("/api/uploads/image", {
            method: "POST",
            body: formData
          });
          const uploadData = await uploadRes.json().catch(() => ({}));
          if (!uploadRes.ok) {
            if (msg) {
              msg.style.color = "#dc2626";
              msg.textContent = uploadData.error || "Failed to upload image.";
            }
            return;
          }
          imageUrl = uploadData.imageUrl || null;
        }

        const latVal = document.getElementById("lat")?.value;
        const lngVal = document.getElementById("lng")?.value;

        const payload = {
          ownerId: currentUser.id,
          title: document.getElementById("title")?.value.trim() || "",
          address: document.getElementById("address")?.value.trim() || "",
          price: Number(document.getElementById("price")?.value || 0),
          distanceKm: Number(document.getElementById("distanceKm")?.value || 0),
          rooms: Number(document.getElementById("rooms")?.value || 1),
          phone: document.getElementById("phone")?.value.trim() || "",
          description: document.getElementById("description")?.value.trim() || "",
          lat: latVal !== "" && latVal !== undefined ? Number(latVal) : null,
          lng: lngVal !== "" && lngVal !== undefined ? Number(lngVal) : null,
          wifi: Boolean(document.getElementById("wifi")?.checked),
          food: Boolean(document.getElementById("food")?.checked),
          imageUrl: imageUrl
        };

        const res = await fetch(`/api/listings/owner/${currentUser.id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (msg) {
            msg.style.color = "#dc2626";
            msg.textContent = data.error || "Failed to submit listing.";
          }
          return;
        }

        if (msg) {
          msg.style.color = "#15803d";
          msg.textContent = "Listing submitted! Waiting for Admin approval.";
        }
        document.getElementById("listingForm")?.reset();
        await loadMyListings();
      } catch (err) {
        if (msg) {
          msg.style.color = "#dc2626";
          msg.textContent = "Network or server error while submitting.";
        }
      }
    }

    async function deleteListing(id) {
      if (!confirm("Delete this listing?")) return;
      const res = await fetch(`/api/listings/${id}`, { method: "DELETE" });
      if (res.ok) {
        await loadMyListings();
      } else {
        alert("Could not delete listing.");
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    initNav();
    loadMyListings();
</script>
</body>
</html>
