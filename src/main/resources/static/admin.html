<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLIIT Boarding Finder — Admin Panel</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { margin: 0; background: #f8fafc; color: #0f172a; }
        nav {
          background: #0f172a;
          color: #fff;
          padding: 14px 28px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .nav-brand { font-size: 18px; font-weight: 700; color: #93c5fd; text-decoration: none; }
        .nav-links a {
          color: #e2e8f0;
          text-decoration: none;
          border: 1px solid #334155;
          padding: 6px 12px;
          border-radius: 8px;
          font-size: 13px;
          margin-left: 10px;
        }
        .container { max-width: 1050px; margin: 24px auto; padding: 0 20px; }
        .card {
          background: #fff;
          border-radius: 14px;
          padding: 20px;
          box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; color: #334155; font-size: 12px; text-transform: uppercase; }
        .status {
          font-size: 11px;
          font-weight: 700;
          padding: 4px 10px;
          border-radius: 999px;
        }
        .status.PENDING { background: #fef3c7; color: #92400e; }
        .status.APPROVED { background: #dcfce7; color: #166534; }
        .status.REJECTED { background: #fee2e2; color: #991b1c; }
        .btn {
          border: none;
          padding: 6px 10px;
          border-radius: 6px;
          font-size: 12px;
          font-weight: 600;
          cursor: pointer;
          margin-right: 4px;
        }
        .btn-approve { background: #16a34a; color: #fff; }
        .btn-reject { background: #dc2626; color: #fff; }
    </style>
</head>
<body>
<nav>
    <a class="nav-brand" href="/index.html">SLIIT Boarding Finder — Admin</a>
    <div class="nav-links">
        <a href="/index.html">Public Boardings</a>
        <a href="/owner.html">Owner Portal</a>
        <a href="/login.html">Login</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2 style="margin-top:0; color:#1e3a8a;">All Boarding Listings Moderation</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Rent (LKR)</th>
                <th>Distance</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr><td colspan="7">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const rawUser = localStorage.getItem("sliitUser");
    if (!rawUser) {
      alert("Please login as Admin first.");
      window.location.href = "/login.html";
    }
    const currentUser = JSON.parse(rawUser || "{}");
    if (currentUser.role !== "ADMIN") {
      alert("Access Denied! Admin page is only accessible to Admins.");
      window.location.href = "/index.html";
    }

    async function loadAllListings() {
      const tbody = document.getElementById("tableBody");
      try {
        const res = await fetch("/api/listings/all");
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) {
          tbody.innerHTML = "<tr><td colspan='7'>No listings found.</td></tr>";
          return;
        }
        tbody.innerHTML = list.map(item => `
          <tr>
            <td>#${item.id}</td>
            <td><strong>${escapeHtml(item.title)}</strong></td>
            <td>${Number(item.price).toLocaleString()}</td>
            <td>${item.distanceKm} km</td>
            <td>${escapeHtml(item.phone)}</td>
            <td><span class="status ${item.status}">${item.status}</span></td>
            <td>
              <button class="btn btn-approve" onclick="setStatus(${item.id}, 'APPROVED')">Approve</button>
              <button class="btn btn-reject" onclick="setStatus(${item.id}, 'REJECTED')">Reject</button>
            </td>
          </tr>
        `).join("");
      } catch (e) {
        tbody.innerHTML = "<tr><td colspan='7'>Failed to load listings.</td></tr>";
      }
    }

    async function setStatus(id, status) {
      try {
        const res = await fetch(`/api/listings/${id}/status?status=${encodeURIComponent(status)}`, {
          method: "PATCH"
        });
        if (!res.ok) {
          const errText = await res.text().catch(() => "");
          alert(`Failed to update status (${res.status}): ${errText || res.statusText}`);
          return;
        }
        await loadAllListings();
      } catch (err) {
        alert("Request error: " + (err?.message || err));
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    loadAllListings();
</script>
</body>
</html>
